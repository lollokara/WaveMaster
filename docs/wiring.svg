<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="1200" height="800" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="30" y="34" font-size="16" font-weight="bold" text-anchor="start">WaveMaster wiring: ESP32-S3, ATmega328P companion, IPG DB25 laser interface</text>
<rect x="30" y="100" width="230" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="40" y="122" font-size="13" font-weight="bold" text-anchor="start">AD3552R DAC</text>
<text x="40" y="140" font-size="11" font-weight="normal" text-anchor="start">dual 16-bit, +/-10 V range</text>
<text x="40" y="157" font-size="11" font-weight="normal" text-anchor="start">CH0 VOUT0, CH1 VOUT1</text>
<rect x="290" y="100" width="150" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="300" y="122" font-size="12" font-weight="bold" text-anchor="start">Galvo X/Y driver</text>
<text x="300" y="142" font-size="11" font-weight="normal" text-anchor="start">X &lt;- CH0   Y &lt;- CH1</text>
<line x1="260" y1="145" x2="283" y2="145" stroke="#000000" stroke-width="1.5"/>
<polygon points="290,145 282,141 282,149" fill="#000000"/>
<line x1="145" y1="190" x2="145" y2="260" stroke="#000000" stroke-width="1.5"/>
<text x="152" y="232" font-size="11" font-weight="normal" text-anchor="start">quad SPI</text>
<rect x="30" y="260" width="230" height="440" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="40" y="282" font-size="13" font-weight="bold" text-anchor="start">ESP32-S3 (controller)</text>
<text x="40" y="302" font-size="11" font-weight="normal" text-anchor="start">AD3552R bus: SCK 5, CS 6,</text>
<text x="40" y="318" font-size="11" font-weight="normal" text-anchor="start">QSPI sel 7, DIR 8, RST 9,</text>
<text x="40" y="334" font-size="11" font-weight="normal" text-anchor="start">D3..D0 = GPIO 10..13</text>
<text x="40" y="354" font-size="11" font-weight="normal" text-anchor="start">USB-C: host link (Rayforge)</text>
<text x="40" y="370" font-size="11" font-weight="normal" text-anchor="start">native USB-Serial-JTAG</text>
<text x="40" y="674" font-size="11" font-weight="normal" text-anchor="start">common ground with all</text>
<text x="40" y="690" font-size="11" font-weight="normal" text-anchor="start">ATmega and laser DB25</text>
<line x1="260" y1="572" x2="470" y2="572" stroke="#d62728" stroke-width="1.5"/>
<text x="40" y="576" font-size="11" font-weight="normal" text-anchor="start">GPIO4  gate (EMISSION MOD)</text>
<line x1="260" y1="598" x2="470" y2="598" stroke="#d62728" stroke-width="1.5"/>
<text x="40" y="602" font-size="11" font-weight="normal" text-anchor="start">GPIO3  SYNC / PRR (LEDC)</text>
<text x="40" y="724" font-size="11" font-weight="normal" text-anchor="start">UART0: GPIO44 TX, GPIO43 RX</text>
<text x="40" y="740" font-size="11" font-weight="normal" text-anchor="start">250 kbaud 8N1 via level shifter</text>
<polyline points="240,700 240,777 1055,777 1055,748" fill="none" stroke="#444444" stroke-width="1.5"/>
<rect x="480" y="762" width="260" height="30" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="610" y="782" font-size="11" font-weight="normal" text-anchor="middle">level shifter</text>
<rect x="470" y="56" width="290" height="692" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="615" y="78" font-size="12" font-weight="bold" text-anchor="middle">IPG DB25 laser connector</text>
<text x="478" y="108" font-size="11" font-weight="normal" text-anchor="start">1  D0  power bit 0 (LSB)</text>
<text x="478" y="134" font-size="11" font-weight="normal" text-anchor="start">2  D1  power bit 1</text>
<text x="478" y="160" font-size="11" font-weight="normal" text-anchor="start">3  D2  power bit 2</text>
<text x="478" y="186" font-size="11" font-weight="normal" text-anchor="start">4  D3  power bit 3</text>
<text x="478" y="212" font-size="11" font-weight="normal" text-anchor="start">5  D4  power bit 4</text>
<text x="478" y="238" font-size="11" font-weight="normal" text-anchor="start">6  D5  power bit 5</text>
<text x="478" y="264" font-size="11" font-weight="normal" text-anchor="start">7  D6  power bit 6</text>
<text x="478" y="290" font-size="11" font-weight="normal" text-anchor="start">8  D7  power bit 7 (MSB)</text>
<text x="478" y="316" font-size="11" font-weight="normal" text-anchor="start">9  LATCH strobe</text>
<text x="478" y="342" font-size="11" font-weight="normal" text-anchor="start">10  GND</text>
<text x="478" y="368" font-size="11" font-weight="normal" text-anchor="start">11  STAT / LASERST</text>
<text x="478" y="394" font-size="11" font-weight="normal" text-anchor="start">12  STAT / alarm</text>
<text x="478" y="420" font-size="11" font-weight="normal" text-anchor="start">13  not connected</text>
<text x="478" y="446" font-size="11" font-weight="normal" text-anchor="start">14  GND</text>
<text x="478" y="472" font-size="11" font-weight="normal" text-anchor="start">15  not used</text>
<text x="478" y="498" font-size="11" font-weight="normal" text-anchor="start">16  STAT / alarm</text>
<text x="478" y="524" font-size="11" font-weight="normal" text-anchor="start">17  +5 V (JCZ)</text>
<text x="478" y="550" font-size="11" font-weight="normal" text-anchor="start">18  MO / EMISSION ENABLE</text>
<text x="478" y="576" font-size="11" font-weight="normal" text-anchor="start">19  AP/PA  EMISSION MOD (gate)</text>
<text x="478" y="602" font-size="11" font-weight="normal" text-anchor="start">20  PRR / SYNC</text>
<text x="478" y="628" font-size="11" font-weight="normal" text-anchor="start">21  LASERST3 (spare)</text>
<text x="478" y="654" font-size="11" font-weight="normal" text-anchor="start">22  Red guide on/off</text>
<text x="478" y="680" font-size="11" font-weight="normal" text-anchor="start">23  EMERGENCY STOP (high = run)</text>
<text x="478" y="706" font-size="11" font-weight="normal" text-anchor="start">24  GND (optional)</text>
<text x="478" y="732" font-size="11" font-weight="normal" text-anchor="start">25  not connected</text>
<rect x="940" y="56" width="230" height="692" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="1055" y="78" font-size="12" font-weight="bold" text-anchor="middle">ATmega328P (Arduino Mini)</text>
<line x1="760" y1="104" x2="940" y2="104" stroke="#1f4fd8" stroke-width="1.5"/>
<text x="950" y="108" font-size="11" font-weight="normal" text-anchor="start">D2  bit 0 (was A7)</text>
<line x1="760" y1="130" x2="940" y2="130" stroke="#1f4fd8" stroke-width="1.5"/>
<text x="950" y="134" font-size="11" font-weight="normal" text-anchor="start">D4  bit 1 (was A6)</text>
<line x1="760" y1="156" x2="940" y2="156" stroke="#1f4fd8" stroke-width="1.5"/>
<text x="950" y="160" font-size="11" font-weight="normal" text-anchor="start">A4  bit 2</text>
<line x1="760" y1="182" x2="940" y2="182" stroke="#1f4fd8" stroke-width="1.5"/>
<text x="950" y="186" font-size="11" font-weight="normal" text-anchor="start">A2  bit 3</text>
<line x1="760" y1="208" x2="940" y2="208" stroke="#1f4fd8" stroke-width="1.5"/>
<text x="950" y="212" font-size="11" font-weight="normal" text-anchor="start">A1  bit 4</text>
<line x1="760" y1="234" x2="940" y2="234" stroke="#1f4fd8" stroke-width="1.5"/>
<text x="950" y="238" font-size="11" font-weight="normal" text-anchor="start">D13 bit 5</text>
<line x1="760" y1="260" x2="940" y2="260" stroke="#1f4fd8" stroke-width="1.5"/>
<text x="950" y="264" font-size="11" font-weight="normal" text-anchor="start">D3  bit 6</text>
<line x1="760" y1="286" x2="940" y2="286" stroke="#1f4fd8" stroke-width="1.5"/>
<text x="950" y="290" font-size="11" font-weight="normal" text-anchor="start">D5  bit 7</text>
<line x1="760" y1="312" x2="940" y2="312" stroke="#1f4fd8" stroke-width="1.5"/>
<text x="950" y="316" font-size="11" font-weight="normal" text-anchor="start">D6  LATCH out</text>
<line x1="760" y1="338" x2="940" y2="338" stroke="#000000" stroke-width="1.5"/>
<text x="950" y="342" font-size="11" font-weight="normal" text-anchor="start">GND</text>
<line x1="760" y1="364" x2="940" y2="364" stroke="#e07b00" stroke-width="1.5"/>
<text x="950" y="368" font-size="11" font-weight="normal" text-anchor="start">D9  STAT 11 in</text>
<line x1="760" y1="390" x2="940" y2="390" stroke="#e07b00" stroke-width="1.5"/>
<text x="950" y="394" font-size="11" font-weight="normal" text-anchor="start">D10 STAT 12 in</text>
<line x1="760" y1="442" x2="940" y2="442" stroke="#000000" stroke-width="1.5"/>
<text x="950" y="446" font-size="11" font-weight="normal" text-anchor="start">GND</text>
<line x1="760" y1="494" x2="940" y2="494" stroke="#e07b00" stroke-width="1.5"/>
<text x="950" y="498" font-size="11" font-weight="normal" text-anchor="start">A3  STAT 16 in</text>
<line x1="760" y1="520" x2="940" y2="520" stroke="#e07b00" stroke-width="1.5"/>
<text x="950" y="524" font-size="11" font-weight="normal" text-anchor="start">A5  5 V detect in</text>
<line x1="760" y1="546" x2="940" y2="546" stroke="#2ca02c" stroke-width="1.5"/>
<text x="950" y="550" font-size="11" font-weight="normal" text-anchor="start">A0  EMISSION ENABLE</text>
<line x1="760" y1="650" x2="940" y2="650" stroke="#2ca02c" stroke-width="1.5"/>
<text x="950" y="654" font-size="11" font-weight="normal" text-anchor="start">D7  guide laser</text>
<line x1="760" y1="676" x2="940" y2="676" stroke="#2ca02c" stroke-width="1.5"/>
<text x="950" y="680" font-size="11" font-weight="normal" text-anchor="start">D8  AUX OFF (held high)</text>
<rect x="290" y="236" width="162" height="118" fill="#fafafa" stroke="#999999" stroke-width="1"/>
<text x="298" y="252" font-size="11" font-weight="bold" text-anchor="start">Legend</text>
<line x1="298" y1="268" x2="318" y2="268" stroke="#d62728" stroke-width="3"/>
<text x="324" y="272" font-size="9.5" font-weight="normal" text-anchor="start">19, 20  ESP32 fast</text>
<line x1="298" y1="285" x2="318" y2="285" stroke="#1f4fd8" stroke-width="3"/>
<text x="324" y="289" font-size="9.5" font-weight="normal" text-anchor="start">1-9  power + LATCH</text>
<line x1="298" y1="302" x2="318" y2="302" stroke="#2ca02c" stroke-width="3"/>
<text x="324" y="306" font-size="9.5" font-weight="normal" text-anchor="start">18, 22, 23  control</text>
<line x1="298" y1="319" x2="318" y2="319" stroke="#e07b00" stroke-width="3"/>
<text x="324" y="323" font-size="9.5" font-weight="normal" text-anchor="start">11, 12, 16, 17  status</text>
<line x1="298" y1="336" x2="318" y2="336" stroke="#000000" stroke-width="3"/>
<text x="324" y="340" font-size="9.5" font-weight="normal" text-anchor="start">10, 14  GND</text>
<text x="30" y="790" font-size="10" font-weight="normal" text-anchor="start">Verify pin assignments against your laser's manual before powering.</text>
</svg>
