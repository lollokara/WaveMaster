; PlatformIO Project Configuration File

[env:esp32-s3-devkitc-1]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
# The ESP32-S3 module on this board has 4 MB of flash. PlatformIO's
# esp32-s3-devkitc-1 profile assumes the 8 MB (N8) variant; an image whose
# header claims 8 MB boot-loops with "Detected size(4096k) smaller than the
# size in the binary image header(8192k)". Keep this in sync with
# CONFIG_ESPTOOLPY_FLASHSIZE_* in sdkconfig.defaults.
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
